name: Native Lean certificate checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Lean 4.34.1
        run: |
          python tools/install_lean_toolchain.py --out /tmp/lemqo-lean
          echo "/tmp/lemqo-lean/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
          rustc --version
      - name: Build pinned native backends
        run: python tools/build_lean_backends.py --work /tmp/lemqo-backends
      - name: Run native offline regressions
        run: >-
          python bridge/lean/tests/run_offline.py
          --bridge-dir /tmp/lemqo-backends/bridge
          --nanoda /tmp/lemqo-backends/nanoda/target/release/nanoda_bin
          --lemqo-root "$GITHUB_WORKSPACE"
